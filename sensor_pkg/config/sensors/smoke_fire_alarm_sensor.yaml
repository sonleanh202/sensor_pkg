smoke_fire_alarm_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 5
    read_register: 3
    register_count: 1
    scale: 1.0
    offset: 0.0
    signed_value: false
    alarm_when_nonzero: true
    warning_threshold: 1.0
    alarm_threshold: 1.0
    enabled: true
    response_timeout_ms: 1000
    poll_interval_ms: 5000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"
    sensor_name: "Fire detector"
    sensor_model: "ES-SD-01"
    quantity: "smoke_alarm_status"
    unit: "state"
    topic_name: "/sensors/smoke_fire_alarm"
    notes: "Sensor status register 0x0003: 0=normal, 1=alarm."
