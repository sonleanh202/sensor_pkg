co_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 4

    read_register: 5
    register_count: 2

    scale: 1.0
    offset: 0.0
    signed_value: false
    alarm_when_nonzero: false

    response_timeout_ms: 3000
    poll_interval_ms: 7000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"

    sensor_name: "CO"
    sensor_model: "ES-CO-01"
    quantity: "carbon_monoxide"
    unit: "ppm"
    topic_name: "/sensors/co"
    notes: "Read CO from two Modbus registers: 5 and 6."

    warning_threshold: 35.0
    alarm_threshold: 100.0
    enabled: true