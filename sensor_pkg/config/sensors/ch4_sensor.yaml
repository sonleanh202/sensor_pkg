ch4_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 3
    read_register: 2
    register_count: 1
    scale: 1.0
    offset: 0.0
    signed_value: false
    enabled: true
    response_timeout_ms: 1000
    poll_interval_ms: 5000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"
    sensor_name: "CH4"
    sensor_model: "ES-CH4-01"
    quantity: "methane"
    unit: "%LEL"
    topic_name: "/sensors/ch4"
    notes: "CH4 value at register 0x0002."
