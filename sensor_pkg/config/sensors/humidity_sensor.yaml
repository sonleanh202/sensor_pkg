humidity_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 7
    response_timeout_ms: 1000
    poll_interval_ms: 5000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"
    enabled: false

    humidity_register: 0
    temperature_register: 1
    humidity_scale: 0.1
    temperature_scale: 0.1
    temperature_offset: 0.0
    temperature_signed: true

    humidity_warning_threshold: 80.0
    humidity_alarm_threshold: 90.0

    sensor_model: "RT WS N01 QT"
    humidity_sensor_name: "Humidity"
    temperature_sensor_name: "Temperature"
    humidity_topic_name: "/sensors/humidity"
    temperature_topic_name: "/sensors/temperature"
    humidity_unit: "%RH"
    temperature_unit: "\u00B0C"
    humidity_notes: "Humidity at register 0"
    temperature_notes: "Temperature at register 1"