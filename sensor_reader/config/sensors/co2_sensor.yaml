co2_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 2
    read_register: 2
    register_count: 1
    scale: 1.0
    offset: 0.0
    signed_value: false
    response_timeout_ms: 3000
    poll_interval_ms: 5000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"
    sensor_name: "CO2"
    sensor_model: "ES-CO2-01"
    quantity: "carbon_dioxide"
    unit: "ppm"
    topic_name: "/sensor/co2"
    notes: "CO2 register 0x0002, direct ppm"

    enabled: true