o2_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 5

    read_register: 2
    register_count: 1
    scale: 0.1
    offset: 0.0
    signed_value: false

    response_timeout_ms: 3000
    poll_interval_ms: 5000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"

    sensor_name: "O2"
    sensor_model: "ES-O2-01"
    quantity: "oxygen"
    unit: "%VOL"
    topic_name: "/sensor/o2"
    notes: "O2 raw unit is 0.1 %VOL from register 0x0002."
    enabled: true