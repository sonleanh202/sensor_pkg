h2s_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    address: 1
    response_timeout_ms: 3000
    poll_interval_ms: 5000
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"

    sensor_name: "H2S"
    sensor_model: "SEN0467"
    quantity: "hydrogen_sulfide"
    unit: "ppm"
    topic_name: "/sensor/h2s"
    notes: "UART-over-RS485 using SEN0467"

    enabled: false