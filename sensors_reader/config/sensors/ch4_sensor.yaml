ch4_sensor_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    slave_id: 2

    read_register: 2
    register_count: 2
    scale: 1.0
    offset: 0.0
    signed_value: false
    alarm_when_nonzero: false

    response_timeout_ms: 3000
    poll_interval_ms: 6500
    bus_lock_file: "/tmp/rs485_modbus_bus.lock"

    sensor_name: "CH4"
    sensor_model: "ES-CH4-01"
    quantity: "methane"
    unit: "%LEL"
    topic_name: "/sensor/ch4"

    warning_threshold: 10.0
    alarm_threshold: 20.0
    enabled: true